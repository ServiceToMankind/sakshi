record_id: SKS-2026-TG-000022
quarantine: true
reason: >
  The record's only source URL carries what appears to be the victim's given name in its
  slug, so the published record (JSON + link target) discloses victim identity (BNS 2023
  s.72; CLAUDE.md §1 — names are never written or committed). The visible title/summary
  are clean, but there is no slug-free source to keep the record citable.
resolution: >
  Restore by re-sourcing this case from an article whose URL does not identify the victim
  (then delete this file), or by an operator-approved slug-stripping policy for citations.
author: claude-code health review (operator ratification requested)
