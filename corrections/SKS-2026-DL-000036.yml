record_id: SKS-2026-DL-000036
quarantine: true
reason: >
  Minor's case published as an ADULT record. This article is one of eight published
  records for a single South East Delhi incident; the incident's own primary report
  (SKS-2026-DL-000025) records the victim as a minor, and DL-000026/040/042 are minor
  records for the same incident. Published as non-minor, this record carried a
  model-written title and summary with a sub-district locality and particulars of the
  act — exactly what CLAUDE.md §1a forbids for a minor (a minor's title/summary is a
  deterministic projection, never model-written; POCSO Act 2012 s.23). The case itself
  stays on the site via the deterministic minor records.
resolution: >
  Retire once dedupe propagates minor_involved across records of one incident (the
  minor flag must win) and this source is merged into the minor record as a source.
author: claude-code health review (operator ratification requested)
date: "2026-10-11"
