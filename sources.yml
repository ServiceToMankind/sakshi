# Enabled data sources — the per-source kill switch, organised BY STATE (§3).
#
# To disable a misbehaving source, set `enabled: false` and commit this file.
# No code change, no redeploy. Order here does NOT imply priority; the dedupe
# merge policy (official/court records beat media) decides authority.
#
# STRUCTURE (§3 — coverage is explicit, gaps are declared):
#   national: sources that are not state-specific (court-record mirrors, national wires).
#   states:   EVERY Indian state/UT is a block. A populated block is covered; an EMPTY block
#             (`[]`) is a DECLARED coverage GAP — a KNOWN blind spot, not a silent one. This
#             is what data/coverage.json + the Coverage page report. Add a feed to a state's
#             block to start covering it. A record can still appear in a state with no source
#             (e.g. an NCR case from a Delhi feed); coverage.json counts that honestly.
#
# COURT-SOURCE ACCESSIBILITY (re-surveyed 2026-08-03 — all 25 HCs + SC; see
# docs/court-portal-survey-2026-08-03.md). Court records are the backbone (CNRs for dedup,
# judicial status, the ONLY permitted source for accused names). What is legitimately
# accessible WITHOUT circumventing any CAPTCHA (a hard, inviolable rule):
#   - eCourts "case status" search: CAPTCHA-gated => consumes only OPERATOR-RESOLVED endpoint
#     URLs via `endpoints` / ECOURTS_ENDPOINTS. Empty => yields nothing (no fabrication).
#   - NJDG: AGGREGATE statistics only, not per-case records. Not usable as a per-case source.
#   - Indian Kanoon: a court-record MIRROR with a DOCUMENTED API. Legitimate via API + ToS,
#     PAID + token-gated. Enabled below but yields nothing until INDIANKANOON_API_TOKEN is set.
#   - HIGH COURT judgment portals (2026-08-03 survey): SEVEN are cleanly OPEN (no CAPTCHA,
#     robots-permitted HTML listings of judgment PDFs) — Delhi, J&K & Ladakh, Jharkhand,
#     Madhya Pradesh, Madras, Meghalaya (legacy-orders), Punjab & Haryana. BUT none of the
#     open paths offers a statute-SECTION facet (POCSO/BNS/IPC), so they support only
#     fetch-everything-then-filter. Seven more are hard CAPTCHA-gated (SC, Calcutta,
#     Chhattisgarh, Kerala, Patna, Rajasthan, Tripura — never bypass), three unreachable from
#     CI egress (Bombay, Karnataka, Telangana — likely geo-fenced), two unknown (Allahabad
#     429, Himachal JS-rendered). TAKEAWAY: the IK token remains the critical path for
#     section-targeted, all-India court coverage; the open HCs are a valuable supplement.
#   - Wiring the open HCs needs a NEW `hc_judgments` source module (fetch the HTML listing ->
#     judgment PDF URLs -> PDF text -> extract). It does not exist yet, so the open portals are
#     documented in the survey (not added here as inert entries). That module is the follow-up.
#
# Types: ecourts | indiankanoon | rss (see git history for the full notes).
#
# SOURCE TIERS (§3 — court sources are the RECORD; media is the discovery net). Each fetched
# source is classified (pipeline/provenance.classify_source_type) into a source_type, and a
# record's TIER is the strongest (lowest) among its sources:
#   tier 1  court        — ecourts / indiankanoon(court docsource) — CNR, status, pendency, names
#   tier 2  legal_press  — LiveLaw, Bar & Bench — court proceedings with a court citation
#   tier 3  news_article / press_release — incident/arrest/FIR reports; not yet a court record
#   tier 4  live_blog    — rolling coverage (quarantine only)
# The site marks a tier-3-only record "Reported in media — not yet traced to a court record",
# and celebrates the tier-3 -> court transition ("Traced to a court record on <date>").

# --- National (not state-specific) ------------------------------------------------------
national:
  - id: ecourts-njdg
    type: ecourts
    enabled: true
    publisher: eCourts
    # Operator-resolved endpoints only (direct case-search is CAPTCHA-gated). Empty => nothing.
    endpoints: []

  - id: indian-kanoon
    type: indiankanoon
    enabled: true # active, but yields NOTHING until INDIANKANOON_API_TOKEN is set (safe)
    publisher: Indian Kanoon
    # Court-record mirror. Each query is billed — keep the list tight; broaden by adding a
    # `doctypes:<court>` query per state as coverage expands. Bump the year each January.
    queries:
      - "rape OR POCSO OR \"sexual assault\" doctypes:delhi fromdate:1-1-2026"
      - "rape OR POCSO OR \"sexual assault\" doctypes:telangana fromdate:1-1-2026"

  - id: pti
    type: rss
    enabled: false # disabled example — set a real national wire feed after a source review
    publisher: PTI
    url: ""

  # --- Tranche 1 (DRAFT — every feed enabled:false; flip per source after operator sign-off).
  # robots.txt verdicts verified 2026-08-01 for the sakshi-bot UA; see
  # docs/feed-expansion-tranche-1.md for the full checklist + the candidates excluded on robots.
  - id: times-of-india-top
    type: rss
    enabled: false # robots: ALLOW · feed: 200 XML · ToS: RSS publicly syndicated (legal review pending)
    publisher: The Times of India
    url: "https://timesofindia.indiatimes.com/rssfeedstopstories.cms"

  - id: hindustan-times-india
    type: rss
    enabled: false # robots: ALLOW · feed: 200 XML · ToS: RSS publicly syndicated (legal review pending)
    publisher: Hindustan Times
    url: "https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml"

  # --- §4b legal press (TIER 2 — court proceedings with a case citation). Publisher name
  # "LiveLaw" is classified as legal_press (pipeline/provenance). robots verified 2026-08-03.
  - id: livelaw
    type: rss
    enabled: false # robots: ALLOW · feed: 200 XML · legal_press (tier 2) · ToS review pending
    publisher: LiveLaw
    url: "https://www.livelaw.in/google_feeds.xml"

  # ==========================================================================================
  # §4d REGIONAL-LANGUAGE — HINDI. robots verified ALLOW + valid RSS on 2026-08-03.
  # ⛔ DO NOT set enabled: true until the MULTILINGUAL PII GUARD (§4e) is WIRED into
  #    pii_constants/sanitize/pii_guard (a PROTECTED change needing a human-approved issue —
  #    see docs/multilingual-pii-guard-proposal.md + pipeline/pii_multilingual.py). Every active
  #    identity gate is an English regex today; enabling a Hindi source before the guard fires
  #    runs the pipeline with the identity floor DISABLED for its input. See docs/feed-expansion
  #    -regional-4d.md for the enablement gate + the other languages' candidate feeds.
  - id: dainik-bhaskar-hi
    type: rss
    enabled: false # HINDI · robots ALLOW · 200 XML · BLOCKED on §4e guard (do not enable)
    publisher: Dainik Bhaskar
    url: "https://www.bhaskar.com/rss-v1--category-4587.xml"

  - id: amar-ujala-hi
    type: rss
    enabled: false # HINDI · robots ALLOW · 200 XML · BLOCKED on §4e guard (do not enable)
    publisher: Amar Ujala
    url: "https://www.amarujala.com/rss/breaking-news.xml"

# --- Per state / UT --------------------------------------------------------------------
# Every canonical state/UT is listed. `[]` = a DECLARED coverage gap (see header).
states:
  AN: [] # Andaman & Nicobar Islands
  AP: [] # Andhra Pradesh
  AR: [] # Arunachal Pradesh
  AS: [] # Assam
  BR: [] # Bihar
  CH: [] # Chandigarh
  CT: [] # Chhattisgarh
  DL: # Delhi
    - id: the-hindu-delhi
      type: rss
      enabled: true
      publisher: The Hindu
      url: "https://www.thehindu.com/news/cities/Delhi/feeder/default.rss"
    - id: indian-express-delhi
      type: rss
      enabled: true
      publisher: The Indian Express
      url: "https://indianexpress.com/section/cities/delhi/feed/"
    # §4a TIER-1 COURT SOURCE — Delhi HC judgment portal (direct-PDF HTML listing; survey
    # 2026-08-03: ~315 docs, no CAPTCHA, case-no + status readable). Each PDF is fetched +
    # statute-pre-filtered IN MEMORY (pipeline/sources/hc_judgments). ⛔ enabled:false — a
    # source lands disabled, always; enabling (and confirming the exact GET listing URL) is
    # the operator's. Qualifying rate in the survey sample was ~0% (mixed feed) — the local
    # pre-filter is exactly what keeps that cheap.
    - id: delhi-hc-judgments
      type: hc_judgments
      enabled: false
      courts:
        - court: "Delhi High Court"
          listing_url: "https://delhihighcourt.nic.in/web/judgement/fetch-data"
          base_url: "https://delhihighcourt.nic.in"
  DN: [] # Dadra & Nagar Haveli and Daman & Diu
  GA: [] # Goa
  GJ: [] # Gujarat
  HP: [] # Himachal Pradesh
  HR: [] # Haryana
  JH: [] # Jharkhand
  JK: # Jammu & Kashmir
    # §4a TIER-1 COURT SOURCE — J&K and Ladakh HC judgment portal (flat HTML, direct PDF
    # links with the case number embedded in the filename; survey 2026-08-03: ~64 docs, no
    # CAPTCHA, status readable). Fetched + statute-pre-filtered IN MEMORY. ⛔ enabled:false —
    # enabling is the operator's. NOTE (survey): the Jharkhand HC endpoint currently MISROUTES
    # to this same J&K content on shared NIC infra, so Jharkhand is intentionally NOT wired
    # until its true endpoint is confirmed (a wrong-court record is worse than a gap).
    - id: jk-hc-judgments
      type: hc_judgments
      enabled: false
      courts:
        - court: "High Court of Jammu & Kashmir and Ladakh"
          listing_url: "https://jkhighcourt.nic.in/judgments_hc.php"
          base_url: "https://jkhighcourt.nic.in"
  KA: [] # Karnataka
  KL: [] # Kerala
  LA: [] # Ladakh
  LD: [] # Lakshadweep
  MH: [] # Maharashtra
  ML: # Meghalaya
    # §4a TIER-1 COURT SOURCE — Meghalaya HC "legacy orders" (direct-PDF daily order-sheets;
    # survey 2026-08-03: ~495 docs, no CAPTCHA). CAVEATS the operator must weigh before
    # enabling: the legacy set is 2013-2015 & PRE-CNR (case numbers only), each PDF BUNDLES
    # many orders (the extractor must segment per case-number header), and the sampled
    # qualifying rate was ~0% (old civil/misc). Low-yield; wired for completeness, IN MEMORY,
    # ⛔ enabled:false — enabling is the operator's; prefer the newer orders feed when live.
    - id: meghalaya-hc-judgments
      type: hc_judgments
      enabled: false
      courts:
        - court: "High Court of Meghalaya"
          listing_url: "https://meghalayahighcourt.nic.in/legacy-orders"
          base_url: "https://meghalayahighcourt.nic.in"
  MN: [] # Manipur
  MP: [] # Madhya Pradesh
  MZ: [] # Mizoram
  NL: [] # Nagaland
  OD: [] # Odisha
  PB: [] # Punjab
  PY: [] # Puducherry
  RJ: [] # Rajasthan
  SK: [] # Sikkim
  TG: # Telangana
    - id: the-hindu-hyderabad
      type: rss
      enabled: true
      publisher: The Hindu
      url: "https://www.thehindu.com/news/cities/Hyderabad/feeder/default.rss"
    - id: indian-express-hyderabad
      type: rss
      enabled: true
      publisher: The Indian Express
      url: "https://indianexpress.com/section/cities/hyderabad/feed/"
  TN: [] # Tamil Nadu
  TR: [] # Tripura
  UP: [] # Uttar Pradesh (NCR cases currently arrive via the Delhi feeds)
  UT: [] # Uttarakhand
  WB: [] # West Bengal

# Extraction model chain (ordered fallback). PINNED ids — never a `-latest` alias, which
# repoints silently and turns an external model swap into a surprise mid-run failure for a
# daily unattended job. On sustained provider failure of one model, extraction fails over to
# the next before aborting. Every model gets the same schema-constrained prompt and the same
# sanitize gate, so the Phase 0 guardrails hold regardless of which model answered.
extraction:
  models:
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
