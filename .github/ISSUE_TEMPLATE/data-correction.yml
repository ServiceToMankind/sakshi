name: Data correction / removal
description: Ask for a published case record to be corrected or removed.
title: "data: correction to "
labels: ["data-correction", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Use this form to fix a factual mistake in a published record, update
        a court status, or ask for a record to be removed.

        **When I remove records.** Records for cases that ended in **acquittal**
        or were **quashed** can be removed on request. Other removals are
        considered one by one; see `TAKEDOWN.md`.

        **One absolute rule.** Never include anything that could identify a
        victim. Sakshi never collects victim names, ages (beyond "minor"),
        addresses, family members, schools, workplaces, photos, or any other
        identifying detail. Everything you write here is public.
  - type: checkboxes
    id: pii-affirmation
    attributes:
      label: Confirm there's no personal data (required)
      options:
        - label: >-
            I confirm this request contains NOTHING that could identify a victim
            (no names, addresses, ages beyond "minor", family/school/workplace
            details, photos, contact details, or ID numbers).
          required: true
  - type: input
    id: record-id
    attributes:
      label: Sakshi record ID
      description: The SKS-... ID shown on the case page, if you have it.
      placeholder: SKS-2026-TG-000123
    validations:
      required: false
  - type: input
    id: cnr-fir
    attributes:
      label: CNR or FIR reference
      description: >-
        If you don't have the SKS ID, give the court case number (CNR) or the
        FIR reference (police station and number) so I can find the record.
      placeholder: "CNR: TSHC01-004321-2026  —  or FIR: Begumpet PS 112/2026"
    validations:
      required: false
  - type: dropdown
    id: request-type
    attributes:
      label: Type of request
      options:
        - Correct a factual error
        - Update judicial status
        - Removal — acquittal
        - Removal — quashed
        - Removal — other (explain below)
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What is wrong
      description: Tell me which field or fact is wrong, or what should be removed.
    validations:
      required: true
  - type: textarea
    id: correct-value
    attributes:
      label: Correct value
      description: >-
        What the record should say instead. For a removal, say why (for
        example, acquitted on <date> by <court>).
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Public source URL
      description: >-
        A public source that backs up the correction: an official court record
        or order (best), or a report from an established news outlet. I don't
        change anything without a source.
      placeholder: https://...
    validations:
      required: true
  - type: markdown
    attributes:
      value: >-
        An accused person is presumed innocent until proven guilty. Statuses
        reflect public court records as of the last update.
