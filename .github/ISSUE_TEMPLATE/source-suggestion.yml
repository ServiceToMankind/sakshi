name: Source suggestion
description: Suggest a new public source for the pipeline to read.
title: "source: "
labels: ["source-suggestion", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Sakshi reads **official, structured** records first (court records such as
        High Court judgment pages, and Indian Kanoon through its API and terms) and,
        after that, **RSS feeds from established news outlets**. Government sources
        such as police or PIB press releases are welcome suggestions too. We do
        **not** scrape social media.
  - type: input
    id: source-name
    attributes:
      label: Source name
      placeholder: e.g. Telangana High Court judgment portal
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Source URL
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: source-type
    attributes:
      label: Official or media?
      options:
        - Official / structured (court, government, NCRB, PIB, police)
        - Established media (RSS)
        - Other
    validations:
      required: true
  - type: input
    id: rss-url
    attributes:
      label: RSS feed or API address
      description: If it's a news source, or it offers a structured feed or API, link it here.
      placeholder: https://.../rss
    validations:
      required: false
  - type: textarea
    id: robots-tos
    attributes:
      label: robots.txt and terms of service
      description: >-
        What do the site's robots.txt and terms allow? Please link them. Sakshi
        follows robots.txt, makes at most 1 request every 2 seconds to a site,
        and says honestly who it is. I won't add a source that forbids automated
        access.
    validations:
      required: true
  - type: textarea
    id: credibility
    attributes:
      label: Why is this source credible?
      description: >-
        Tell me where it comes from and how reliable it is: who publishes it,
        their editorial standards, and whether the records are primary (court
        orders) or secondary (reporting).
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Confirmations
      options:
        - label: This isn't a social-media source.
          required: true
        - label: As far as I know, the source's robots.txt and terms allow automated access.
          required: true
