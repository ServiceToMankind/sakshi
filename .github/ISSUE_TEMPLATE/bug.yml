name: Bug report (code or site)
description: Report something broken in the Sakshi pipeline, tooling, or website.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for helping keep the record accurate. This form is for
        problems with the **software**: the data pipeline, schemas, tooling, or
        the website.

        - To correct or remove a **data record**, please use the "Data correction /
          removal" form instead.

        - If it involves **anything that could identify a victim**, or you think
          personal data has leaked, please **don't** file a public issue. Follow
          `SECURITY.md` to tell me privately.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: This is a code or site bug, not a data correction or a request for personal help.
          required: true
        - label: This report contains nothing that could identify a victim.
          required: true
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: What part is affected?
      options:
        - Website / frontend
        - Data pipeline (fetch / extract / sanitize / dedupe)
        - Schemas / validation
        - Build / CI / tooling
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short, clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include the command you ran or the page/URL involved.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Your setup
      description: Browser and version, operating system, and/or Python version and commit.
      placeholder: |
        - Browser: Firefox 128
        - OS: Ubuntu 24.04
        - Commit: abc1234
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: >-
        Paste any relevant logs or attach screenshots. Please remove anything
        that could identify a victim before pasting.
      render: shell
    validations:
      required: false
